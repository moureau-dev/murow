<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>murow renderer benchmarks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #111; color: #eee; font-family: monospace; }
        #controls {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            padding: 8px 12px; background: rgba(0,0,0,0.8);
            display: flex; align-items: center; gap: 12px;
        }
        #controls select {
            background: #222; color: #eee; border: 1px solid #444;
            padding: 4px 8px; font-family: monospace; font-size: 14px;
        }
        #stats { font-size: 13px; color: #8f8; }
        #program-controls {
            position: fixed; top: 48px; right: 12px; z-index: 10;
            background: rgba(0,0,0,0.8); border: 1px solid #333;
            padding: 10px 12px; display: none; flex-direction: column; gap: 6px;
            font-size: 12px; min-width: 220px;
        }
        #program-controls .control-row {
            display: grid; grid-template-columns: 1fr 80px 60px; gap: 6px; align-items: center;
        }
        #program-controls label { color: #ccc; }
        #program-controls input[type=number] {
            background: #1a1a1a; color: #eee; border: 1px solid #444;
            padding: 2px 4px; font-family: monospace; font-size: 12px; width: 100%;
        }
        #program-controls .control-value { color: #8f8; text-align: right; }
        #program-controls button {
            background: #333; color: #eee; border: 1px solid #555;
            padding: 4px 8px; font-family: monospace; font-size: 12px; cursor: pointer;
            margin-top: 4px;
        }
        #program-controls button:disabled { opacity: 0.5; cursor: not-allowed; }
        #program-controls button:not(:disabled):hover { background: #444; }
        canvas {
            display: block; width: 100vw; height: 100vh;
            touch-action: none;
        }
        #error-overlay {
            display: none; position: fixed; inset: 0; z-index: 20;
            align-items: center; justify-content: center;
            pointer-events: none;
        }
        #error-overlay.visible { display: flex; }
        #error-box {
            background: rgba(0,0,0,0.85); color: #f88; font-family: monospace;
            font-size: 13px; padding: 20px 24px; border: 1px solid #f44;
            border-radius: 6px; max-width: 80vw; white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div id="controls">
        <label>Program:</label>
        <select id="program-select"></select>
        <span id="stats"></span>
    </div>
    <div id="program-controls"></div>
    <canvas id="canvas"></canvas>
    <div id="error-overlay"><div id="error-box"></div></div>
    <script type="module" src="./index.ts"></script>
</body>
</html>
